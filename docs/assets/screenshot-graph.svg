<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#151821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- App chrome -->
  <rect x="0" y="0" width="1280" height="40" fill="#1a1c22"/>
  <circle cx="20" cy="20" r="6" fill="#6366f1"/>
  <text x="40" y="25" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">docmap</text>
  <text x="1130" y="25" fill="#64748b" font-family="system-ui" font-size="12">v1.0.0</text>
  <!-- Sidebar -->
  <rect x="0" y="40" width="64" height="680" fill="#16181d"/>
  <rect x="18" y="70" width="28" height="28" rx="6" fill="#6366f1" opacity="0.9"/>
  <rect x="18" y="120" width="28" height="28" rx="6" fill="#334155"/>
  <rect x="18" y="170" width="28" height="28" rx="6" fill="#334155"/>
  <rect x="18" y="220" width="28" height="28" rx="6" fill="#334155"/>
  <!-- Graph panel -->
  <rect x="64" y="40" width="320" height="680" fill="#1a1c22"/>
  <text x="90" y="75" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Graph</text>
  <rect x="84" y="95" width="270" height="32" rx="6" fill="#252830"/>
  <text x="98" y="116" fill="#64748b" font-family="system-ui" font-size="12">Buscar arquivos...</text>
  <!-- Graph nodes -->
  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="240" y1="220" x2="360" y2="180"/>
    <line x1="240" y1="220" x2="180" y2="320"/>
    <line x1="360" y1="180" x2="400" y2="280"/>
    <line x1="180" y1="320" x2="280" y2="400"/>
    <line x1="360" y1="180" x2="320" y2="320"/>
    <line x1="320" y1="320" x2="280" y2="400"/>
  </g>
  <g>
    <rect x="210" y="190" width="80" height="36" rx="18" fill="#252830" stroke="url(#accent)" stroke-width="2"/>
    <text x="250" y="213" fill="#e2e8f0" font-family="system-ui" font-size="12" text-anchor="middle">README</text>
    <rect x="330" y="150" width="100" height="36" rx="18" fill="#252830" stroke="url(#accent)" stroke-width="2"/>
    <text x="380" y="173" fill="#e2e8f0" font-family="system-ui" font-size="12" text-anchor="middle">architecture</text>
    <rect x="140" y="290" width="90" height="36" rx="18" fill="#252830" stroke="#475569" stroke-width="1.5"/>
    <text x="185" y="313" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">api.md</text>
    <rect x="300" y="290" width="100" height="36" rx="18" fill="#252830" stroke="#475569" stroke-width="1.5"/>
    <text x="350" y="313" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">podcasts.md</text>
    <rect x="240" y="370" width="80" height="36" rx="18" fill="#252830" stroke="#475569" stroke-width="1.5"/>
    <text x="280" y="393" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">setup.md</text>
  </g>
  <!-- Main content: preview card -->
  <rect x="404" y="40" width="876" height="680" fill="#13151a"/>
  <text x="440" y="75" fill="#e2e8f0" font-family="system-ui" font-size="18" font-weight="600">README.md</text>
  <rect x="440" y="90" width="800" height="580" rx="12" fill="#1a1c22"/>
  <text x="480" y="140" fill="#f8fafc" font-family="system-ui" font-size="24" font-weight="700">docmap desktop</text>
  <text x="480" y="175" fill="#94a3b8" font-family="system-ui" font-size="14">Atlas de documentação local com IA.</text>
  <rect x="480" y="210" width="200" height="12" rx="6" fill="#334155"/>
  <rect x="480" y="235" width="700" height="10" rx="5" fill="#334155"/>
  <rect x="480" y="255" width="650" height="10" rx="5" fill="#334155"/>
  <rect x="480" y="275" width="680" height="10" rx="5" fill="#334155"/>
  <!-- Floating badge -->
  <rect x="740" y="300" width="280" height="80" rx="12" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1"/>
  <text x="880" y="340" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">100% local</text>
  <text x="880" y="365" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">Dados no seu computador</text>
  <!-- Overlay text -->
  <text x="640" y="680" fill="#475569" font-family="system-ui" font-size="13" font-style="italic" text-anchor="middle">Substitua por screenshot real do grafo</text>
</svg>
