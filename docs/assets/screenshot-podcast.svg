<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#151821"/>
    </linearGradient>
    <radialGradient id="hole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="disk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- App chrome -->
  <rect x="0" y="0" width="1280" height="40" fill="#1a1c22"/>
  <circle cx="20" cy="20" r="6" fill="#6366f1"/>
  <text x="40" y="25" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">docmap</text>
  <!-- Sidebar list -->
  <rect x="0" y="40" width="340" height="680" fill="#1a1c22"/>
  <text x="30" y="75" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Podcasts</text>
  <rect x="20" y="95" width="300" height="36" rx="6" fill="#252830"/>
  <text x="35" y="118" fill="#64748b" font-family="system-ui" font-size="13">Buracos Negros...</text>
  <rect x="20" y="145" width="300" height="56" rx="8" fill="#252830" stroke="#6366f1" stroke-width="1"/>
  <text x="35" y="168" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Buracos Negros — Anatomia...</text>
  <text x="35" y="190" fill="#64748b" font-family="system-ui" font-size="11">cosmos · 7 slides · 1:31</text>
  <rect x="20" y="215" width="300" height="48" rx="8" fill="#252830"/>
  <text x="35" y="238" fill="#94a3b8" font-family="system-ui" font-size="13">Reunião Plataforma...</text>
  <text x="35" y="255" fill="#64748b" font-family="system-ui" font-size="11">geral · 0 slides · 3:45</text>
  <!-- Player area -->
  <rect x="340" y="40" width="940" height="680" fill="#000000"/>
  <!-- Slide content: black hole -->
  <circle cx="810" cy="300" r="120" fill="url(#hole)" filter="drop-shadow(0 0 40px rgba(99,102,241,0.4))"/>
  <ellipse cx="810" cy="300" rx="240" ry="80" fill="none" stroke="url(#disk)" stroke-width="12" opacity="0.7" transform="rotate(-15 810 300)"/>
  <text x="810" y="480" fill="#f8fafc" font-family="system-ui" font-size="32" font-weight="700" text-anchor="middle">O Abismo Cósmico</text>
  <text x="810" y="515" fill="#94a3b8" font-family="system-ui" font-size="16" text-anchor="middle">Nada escapa da gravidade — nem a luz.</text>
  <!-- Audio bar -->
  <rect x="340" y="600" width="940" height="120" fill="#0a0a0a"/>
  <rect x="380" y="635" width="860" height="8" rx="4" fill="#334155"/>
  <rect x="380" y="635" width="320" height="8" rx="4" fill="#6366f1"/>
  <circle cx="700" cy="639" r="8" fill="#6366f1"/>
  <text x="380" y="670" fill="#e2e8f0" font-family="system-ui" font-size="13">▶ 0:32 / 1:31</text>
  <text x="1130" y="670" fill="#94a3b8" font-family="system-ui" font-size="13">slide 3 / 7</text>
  <text x="640" y="700" fill="#475569" font-family="system-ui" font-size="13" font-style="italic" text-anchor="middle">Substitua por screenshot real do player com slides</text>
