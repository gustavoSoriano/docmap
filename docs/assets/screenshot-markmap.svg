      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#151821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- App chrome -->
  <rect x="0" y="0" width="1280" height="40" fill="#1a1c22"/>
  <circle cx="20" cy="20" r="6" fill="#6366f1"/>
  <text x="40" y="25" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">docmap</text>
  <!-- Center markmap -->
  <rect x="64" y="40" width="1152" height="680" fill="#13151a"/>
  <text x="80" y="75" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">Markmap</text>
  <!-- Root node -->
  <rect x="620" y="120" width="120" height="40" rx="8" fill="url(#accent)" filter="drop-shadow(0 0 8px rgba(99,102,241,0.5))"/>
  <text x="680" y="145" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">docmap</text>
  <!-- Branches -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M 680 160 L 680 220"/>
