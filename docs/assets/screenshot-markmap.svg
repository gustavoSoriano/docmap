    <rect x="280" y="340" width="160" height="36" rx="8" fill="#252830" stroke="#6366f1" stroke-width="1.5"/>
    <text x="360" y="363" fill="#e2e8f0" font-family="system-ui" font-size="13" text-anchor="middle">Podcasts</text>
    <rect x="580" y="320" width="180" height="36" rx="8" fill="#252830" stroke="#6366f1" stroke-width="1.5"/>
    <text x="670" y="343" fill="#e2e8f0" font-family="system-ui" font-size="13" text-anchor="middle">Diagramas</text>
    <rect x="580" y="380" width="180" height="36" rx="8" fill="#252830" stroke="#6366f1" stroke-width="1.5"/>
    <text x="670" y="403" fill="#e2e8f0" font-family="system-ui" font-size="13" text-anchor="middle">Tasks</text>
    <rect x="900" y="280" width="180" height="36" rx="8" fill="#252830" stroke="#6366f1" stroke-width="1.5"/>
    <text x="990" y="303" fill="#e2e8f0" font-family="system-ui" font-size="13" text-anchor="middle">Favoritos</text>
